<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#0a0d10;color:#e6edf3;
    font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  body::before{
    content:"";position:fixed;inset:-50%;z-index:0;
    background:
      radial-gradient(circle at 30% 30%,rgba(80,255,150,.09),transparent 45%),
      radial-gradient(circle at 70% 70%,rgba(80,180,255,.07),transparent 45%);
    animation:drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(3%,-3%)}}
  .box{
    position:relative;z-index:1;width:100%;max-width:380px;
    background:rgba(18,24,30,.82);backdrop-filter:blur(14px);
    border:1px solid rgba(120,255,180,.18);border-radius:20px;
    padding:34px 28px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .mark{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .mark svg{width:38px;height:38px;flex:none}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.2px}
  h1 small{display:block;font-size:12px;font-weight:400;color:#7d8b98;margin-top:3px}
  label{display:block;font-size:12px;color:#8b98a5;margin:0 0 7px;letter-spacing:.4px;text-transform:uppercase}
  input{
    width:100%;padding:14px 15px;border-radius:12px;
    background:#0d1218;border:1px solid #23303c;color:#e6edf3;
    font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input:focus{border-color:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.13)}
  button{
    width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;
    background:linear-gradient(180deg,#3ddc84,#26b96a);color:#04120a;
    font-size:15px;font-weight:700;letter-spacing:.2px;cursor:pointer;
    transition:transform .1s,filter .15s;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:13.5px;min-height:20px;color:#ff7b72}
  .msg.ok{color:#3ddc84}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 9 4 12l4 3"/><path d="m16 9 4 3-4 3"/>
      <path d="M13.5 5.5 11 18.5"/>
    </svg>
    <h1>Codex<small>Sign in to continue</small></h1>
  </div>
  <label for="p">Password</label>
  <input id="p" name="p" type="password" autofocus required autocomplete="current-password">
  <button id="b" type="submit">Unlock</button>
  <div class="msg" id="m"></div>
</form>
<script>
const f=document.getElementById('f'),p=document.getElementById('p'),
      b=document.getElementById('b'),m=document.getElementById('m');
f.addEventListener('submit',async e=>{
  e.preventDefault();
  b.disabled=true;m.className='msg';m.textContent='Checking…';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
                                 body:JSON.stringify({p:p.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){m.className='msg ok';m.textContent='Welcome back';location.replace('/');}
    else{m.textContent=d.error||'Wrong password';p.select();}
  }catch(err){m.textContent='Network error';}
  b.disabled=false;
});
</script>
</body>
</html>
